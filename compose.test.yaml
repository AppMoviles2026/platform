name: collabpro-platform-tests
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${COLLABPRO_TEST_MYSQL_PORT:-3317}:3306"
    environment:
      MYSQL_DATABASE: collabpro_test
      MYSQL_USER: collabpro_test
      MYSQL_PASSWORD: integration-test-only
      MYSQL_ROOT_PASSWORD: root-integration-test-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
