spring.application.name=collabpro-platform
identity.jwt.secret=${JWT_SECRET}
identity.jwt.issuer=${JWT_ISSUER:collabpro-platform}
identity.jwt.audience=${JWT_AUDIENCE:collabpro-clients}
identity.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration/identity,classpath:db/migration/campaign,classpath:db/migration/collaboration,classpath:db/migration/performance,classpath:db/migration/billing
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
identity.recovery.from=${RECOVERY_FROM:no-reply@collabpro.local}
identity.recovery.reset-url=${RECOVERY_RESET_URL:collabpro://password-reset}
identity.oauth.instagram.client-id=${INSTAGRAM_CLIENT_ID:}
identity.oauth.instagram.client-secret=${INSTAGRAM_CLIENT_SECRET:}
identity.oauth.instagram.redirect-uri=${INSTAGRAM_REDIRECT_URI:}
identity.oauth.instagram.scopes=${INSTAGRAM_SCOPES:instagram_business_basic}
identity.oauth.tiktok.client-id=${TIKTOK_CLIENT_KEY:}
identity.oauth.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:}
identity.oauth.tiktok.redirect-uri=${TIKTOK_REDIRECT_URI:}
identity.oauth.tiktok.scopes=${TIKTOK_SCOPES:user.info.basic}
collabpro.demo-seed.enabled=${COLLABPRO_DEMO_SEED_ENABLED:false}
collabpro.demo-seed.password=${DEMO_SEED_PASSWORD:}
spring.servlet.multipart.max-file-size=${COLLABORATION_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${COLLABORATION_MAX_REQUEST_SIZE:11MB}
collaboration.files.max-bytes=${COLLABORATION_MAX_FILE_BYTES:10485760}
performance.attribution.destinations=${PERFORMANCE_ATTRIBUTION_DESTINATIONS:}
performance.attribution.public-base-url=${PERFORMANCE_ATTRIBUTION_PUBLIC_BASE_URL:http://localhost:8081}
billing.encryption-key=${BILLING_ENCRYPTION_KEY:${identity.encryption-key}}
billing.paypal.enabled=${PAYPAL_ENABLED:false}
billing.paypal.client-id=${PAYPAL_CLIENT_ID:}
billing.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
billing.paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
billing.paypal.funding-return-url=${PAYPAL_RETURN_URL:http://localhost:8081/api/v1/billing/paypal/callback}
billing.paypal.identity-return-url=${PAYPAL_IDENTITY_RETURN_URL:http://localhost:8081/api/v1/billing/paypal/identity-callback}
billing.paypal.android-return-url=collabpro://billing-return
billing.paypal.authorization-seconds=1800
billing.subscriptions.return-url=${PAYPAL_SUBSCRIPTION_RETURN_URL:http://localhost:8081/api/v1/billing/paypal/subscription-callback}
billing.subscriptions.scheduling-enabled=${BILLING_SUBSCRIPTION_SCHEDULING_ENABLED:true}
billing.catalog.demo-enabled=${BILLING_DEMO_CATALOG_ENABLED:${COLLABPRO_DEMO_SEED_ENABLED:false}}
billing.catalog.essential.provider-plan-id=${PAYPAL_ESSENTIAL_PLAN_ID:}
billing.catalog.growth.provider-plan-id=${PAYPAL_GROWTH_PLAN_ID:}
billing.catalog.essential.amount=${BILLING_ESSENTIAL_AMOUNT:5.00}
billing.catalog.growth.amount=${BILLING_GROWTH_AMOUNT:10.00}
