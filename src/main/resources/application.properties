spring.application.name=collabpro-platform
identity.jwt.secret=${JWT_SECRET}
identity.jwt.issuer=${JWT_ISSUER:collabpro-platform}
identity.jwt.audience=${JWT_AUDIENCE:collabpro-clients}
identity.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration/identity,classpath:db/migration/campaign
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
identity.recovery.from=${RECOVERY_FROM:no-reply@collabpro.local}
identity.recovery.reset-url=${RECOVERY_RESET_URL:collabpro://password-reset}
identity.oauth.instagram.client-id=${INSTAGRAM_CLIENT_ID:}
identity.oauth.instagram.client-secret=${INSTAGRAM_CLIENT_SECRET:}
identity.oauth.instagram.redirect-uri=${INSTAGRAM_REDIRECT_URI:}
identity.oauth.tiktok.client-id=${TIKTOK_CLIENT_KEY:}
identity.oauth.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:}
identity.oauth.tiktok.redirect-uri=${TIKTOK_REDIRECT_URI:}
