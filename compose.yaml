name: collabpro-platform
services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: collabpro
      MYSQL_USER: collabpro
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-collabpro-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-collabpro-root-local-only}
    volumes:
      - collabpro-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  platform:
    image: collabpro-platform:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PLATFORM_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8081"
      COLLABPRO_DEMO_SEED_ENABLED: ${COLLABPRO_DEMO_SEED_ENABLED:-true}
      DEMO_SEED_PASSWORD: "${DEMO_SEED_PASSWORD:-CollabProDemo2026!}"
      MYSQL_URL: "jdbc:mysql://mysql:3306/collabpro?connectionTimeZone=UTC"
      MYSQL_USER: collabpro
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-collabpro-local-only}
      PAYPAL_COMPENSATION_RETURN_URL: ${PAYPAL_COMPENSATION_RETURN_URL:-http://localhost:8081/api/v1/billing/paypal/compensation-callback}
      BILLING_COMPENSATION_ENABLED: ${BILLING_COMPENSATION_ENABLED:-true}
      BILLING_COMPENSATION_BATCH_SIZE: ${BILLING_COMPENSATION_BATCH_SIZE:-50}
      BILLING_ORDER_RETRY_SECONDS: ${BILLING_ORDER_RETRY_SECONDS:-18000}
      BILLING_PAYOUT_RETRY_SECONDS: ${BILLING_PAYOUT_RETRY_SECONDS:-2419200}
      BILLING_COMPENSATION_CURRENCIES: ${BILLING_COMPENSATION_CURRENCIES:-USD}
      BILLING_COMPENSATION_SCHEDULING_ENABLED: ${BILLING_COMPENSATION_SCHEDULING_ENABLED:-true}
      BILLING_AUTOMATIC_PAYOUTS: ${BILLING_AUTOMATIC_PAYOUTS:-true}
      PAYPAL_SUBSCRIPTION_RETURN_URL: ${PAYPAL_SUBSCRIPTION_RETURN_URL:-http://localhost:8081/api/v1/billing/paypal/subscription-callback}
      PAYPAL_ESSENTIAL_PLAN_ID: ${PAYPAL_ESSENTIAL_PLAN_ID:-}
      PAYPAL_GROWTH_PLAN_ID: ${PAYPAL_GROWTH_PLAN_ID:-}
      BILLING_DEMO_CATALOG_ENABLED: ${BILLING_DEMO_CATALOG_ENABLED:-true}
      BILLING_ESSENTIAL_AMOUNT: ${BILLING_ESSENTIAL_AMOUNT:-5.00}
      BILLING_GROWTH_AMOUNT: ${BILLING_GROWTH_AMOUNT:-10.00}
      PAYPAL_ENABLED: ${PAYPAL_ENABLED:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-http://localhost:8081/api/v1/billing/paypal/callback}
      PAYPAL_IDENTITY_RETURN_URL: ${PAYPAL_IDENTITY_RETURN_URL:-http://localhost:8081/api/v1/billing/paypal/identity-callback}
      BILLING_ENCRYPTION_KEY: ${BILLING_ENCRYPTION_KEY:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-}
      INSTAGRAM_SCOPES: ${INSTAGRAM_SCOPES:-instagram_business_basic}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
      TIKTOK_SCOPES: ${TIKTOK_SCOPES:-user.info.basic}
      PERFORMANCE_ATTRIBUTION_DESTINATIONS: "${PERFORMANCE_ATTRIBUTION_DESTINATIONS:-demo=https://example.com/collabpro-demo}"
      PERFORMANCE_ATTRIBUTION_PUBLIC_BASE_URL: "${PERFORMANCE_ATTRIBUTION_PUBLIC_BASE_URL:-http://localhost:8081}"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    init: true
volumes:
  collabpro-mysql-data:
